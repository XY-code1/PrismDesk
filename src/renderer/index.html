<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrismDesk</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="brand"><span class="gem">◆</span><div><b>PrismDesk</b><small>统一背景控制台 · 独立社区项目</small></div></div><button id="refresh" class="ghost">刷新检测</button></header><main><section><p class="eyebrow">CLIENTS</p><h1>让工作空间拥有同一片光。</h1><p class="lede">本地背景、可逆注入，不修改客户端安装文件。</p><div id="targets" class="targets"></div></section><section class="editor"><div class="preview" id="preview"><div class="mock"><span></span><span></span><span></span></div><div class="preview-copy"><small>实时预览</small><strong id="themeName">Prism Aurora</strong></div></div><div class="switcher"><button data-kind="aurora" class="active">极光</button><button data-kind="image">图片</button><button id="pick" class="ghost">导入图片</button><button id="importTheme" class="ghost">导入主题</button></div><div class="controls"><label>亮度 <output id="brightnessOut"></output><input id="brightness" type="range" min="0.2" max="1.5" step="0.01"></label><label>透明度 <output id="opacityOut"></output><input id="opacity" type="range" min="0" max="1" step="0.01"></label><label>模糊 <output id="blurOut"></output><input id="blur" type="range" min="0" max="40" step="1"></label><label>速度 <output id="speedOut"></output><input id="speed" type="range" min="0.1" max="3" step="0.1"></label></div><div class="row"><label class="toggle"><input id="motion" type="checkbox"><span></span> 动态效果</label><label>帧率 <select id="fps"><option>15</option><option>30</option><option>60</option></select></label><button id="save" class="primary">保存设置</button></div><div class="pet-block"><p class="eyebrow">PET</p><h2>宠物形态</h2><div class="switcher mode"><button data-mode="in-app" class="active">客户端内悬浮宠物</button><button data-mode="desktop">Windows 桌面宠物</button></div><p class="hint" id="modeHint"></p><div class="pet-grid"><img id="petPreview" class="pet-preview empty" alt="宠物预览"><div class="pet-fields"><div class="switcher"><button id="petPick" class="ghost">导入宠物图片</button><button id="petReset" class="ghost">恢复默认宠物</button></div><label>尺寸 <output id="sizeOut"></output><input id="size" type="range" min="48" max="256" step="8" value="128"></label><div class="row"><label class="toggle"><input id="mirror" type="checkbox"><span></span> 水平镜像</label><label class="toggle"><input id="visible" type="checkbox" checked><span></span> 显示宠物</label></div><p class="hint" id="petHint"></p></div></div></div><p id="notice" role="status"></p></section></main><script type="module" src="app.js"></script></body></html>
